name: Build APK

on:
  push:
    branches: [main]
    tags: ['V*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ローカル開発環境と同じバージョンに固定する（macOS 12でも動作を実測確認済み）
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      - run: flutter build apk --release

      # APK名にバージョンを付与する（例: Y2Eknt-v0.7.0.apk）
      - name: Rename APK with version
        id: apk
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          APK="build/app/outputs/flutter-apk/Y2Eknt-v${VERSION}.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Y2Eknt-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Upload to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/V')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
