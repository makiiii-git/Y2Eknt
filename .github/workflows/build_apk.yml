name: Build APK

on:
  push:
    branches: [main]
    tags: ['V*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ローカル開発環境と同じバージョンに固定する（macOS 12でも動作を実測確認済み）
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      # GitHub配布用の署名鍵を復元する。これが無いとデバッグ署名になり、
      # 鍵がビルドごとに変わるため既存ユーザーが上書き更新できなくなる。
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::署名鍵のSecretが未設定のためデバッグ署名でビルドします"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # ABIごとに分割してAPKを小さくする。x86_64はエミュレータ専用のため作らない。
      - run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64

      # 通常端末向け（arm64）をバージョン名そのままのファイルにする。
      # 例: Y2Eknt-v1.0.4.apk / Y2Eknt-v1.0.4-arm32.apk
      - name: Rename APKs with version
        id: apk
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          DIR=build/app/outputs/flutter-apk
          mv "$DIR/app-arm64-v8a-release.apk" "$DIR/Y2Eknt-v${VERSION}.apk"
          mv "$DIR/app-armeabi-v7a-release.apk" "$DIR/Y2Eknt-v${VERSION}-arm32.apk"
          echo "arm64=$DIR/Y2Eknt-v${VERSION}.apk" >> "$GITHUB_OUTPUT"
          echo "arm32=$DIR/Y2Eknt-v${VERSION}-arm32.apk" >> "$GITHUB_OUTPUT"

      # 署名鍵が前回リリースと同じか確認できるよう指紋を残す。
      # ここが変わると既存ユーザーは上書き更新できない。
      - name: Show signer fingerprint
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs "${{ steps.apk.outputs.arm64 }}" \
            | grep -i "SHA-256 digest" | head -1

      - uses: actions/upload-artifact@v4
        with:
          name: Y2Eknt-apk
          path: |
            ${{ steps.apk.outputs.arm64 }}
            ${{ steps.apk.outputs.arm32 }}

      - name: Upload to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/V')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.apk.outputs.arm64 }}
            ${{ steps.apk.outputs.arm32 }}
